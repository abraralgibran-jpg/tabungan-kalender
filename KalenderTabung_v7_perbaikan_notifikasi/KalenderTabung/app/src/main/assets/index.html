<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalender Tabung</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#80808a;--red:#e5091c;--grn:#0b8a4b;--gb:#e0f4e8;--card:#f4f4f5;--ln:#e2e2e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#f2f2f2;--mut:#9a9aa2;--red:#ff4d5a;--grn:#4fd18b;--gb:#16382a;--card:#1d1d20;--ln:#333}}
:root[data-theme="dark"]{--bg:#121212;--fg:#f2f2f2;--mut:#9a9aa2;--red:#ff4d5a;--grn:#4fd18b;--gb:#16382a;--card:#1d1d20;--ln:#333}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px Roboto,system-ui,sans-serif;overflow-x:hidden}
main{max-width:460px;margin:0 auto;padding:8px 16px 100px}
h1{margin:0;font-weight:700;font-size:36px}h3{margin:0 0 6px;font-weight:500}h2{margin:0;font-size:18px;font-weight:500}
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:8px 4px 0}
.wrap{position:relative;margin-top:24px}.pg{background:var(--bg);touch-action:pan-y;user-select:none}
.wk,.gr{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk span{font-size:14px;padding:14px 0 8px}.s{color:var(--red)}
.d{border:0;background:none;color:inherit;font:300 24px Roboto,system-ui,sans-serif;height:62px;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.d .n{width:38px;height:38px;line-height:38px;border-radius:10px}
.d.su{color:var(--red)}.d.f{opacity:.3;pointer-events:none}
.d.t .n{box-shadow:inset 0 0 0 2px var(--fg)}.d.v .n{background:var(--grn);color:var(--bg)}
.d i{font:500 10px Roboto,system-ui,sans-serif;font-style:normal;color:var(--grn)}.d i.m{color:var(--red)}.d.e .n{outline:2px dashed var(--grn);outline-offset:-2px}.d.f.e{opacity:.8}.pct{font-size:40px;font-weight:700;line-height:1}.ml button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:15px;margin-top:8px;border:1px solid var(--ln);border-radius:14px;background:none;color:var(--fg);font:inherit;font-size:17px}
.up{display:block;width:100%;min-height:48px;text-align:center;border:1px dashed var(--mut);border-radius:12px;padding:12px;margin:8px 0;font:inherit;font-size:16px;background:none;color:var(--fg);cursor:pointer;touch-action:manipulation}.up:active{background:var(--card)}.up{position:relative;overflow:hidden}.up .fi{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:0;opacity:0;cursor:pointer;font-size:0;pointer-events:auto}.pr{display:flex;align-items:center;gap:12px;margin:8px 0}.rw label{min-width:0}input[type=date],input[type=time]{min-width:0;min-height:50px}
.en{border-bottom:1px solid var(--ln);padding:8px 0}.en .mu{margin:0}
.gi{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
#fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:34px;line-height:1;box-shadow:0 6px 16px #0004;z-index:8}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:436px;margin:0 auto;z-index:20;background:var(--fg);color:var(--bg);border-radius:14px;padding:14px;box-shadow:0 8px 24px #0005;animation:up .3s}#toast b{display:block;margin-bottom:2px}#toast .rw{margin-top:10px;justify-content:flex-end}#toast button{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:500;background:var(--bg);color:var(--fg)}#toast .x{background:none;color:var(--bg);opacity:.8}
.p .n{animation:pop .5s}.p i{animation:st .5s}
@keyframes pop{40%{transform:scale(1.35) rotate(-8deg)}}
@keyframes st{from{transform:translateY(-16px) scale(1.7);opacity:0}}
.in{animation:up .5s}@keyframes up{from{transform:scale(.96);opacity:.4}}
.tear{position:absolute;inset:0;z-index:5;pointer-events:none;transform-origin:50% 0}
.tl{animation:tl .6s cubic-bezier(.5,0,.9,.4) forwards}.tr{animation:tr .6s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes tl{25%{transform:rotate(2deg) translateY(-8px)}100%{transform:translate(-130%,50px) rotate(-16deg);opacity:.2}}
@keyframes tr{25%{transform:rotate(-2deg) translateY(-8px)}100%{transform:translate(130%,50px) rotate(16deg);opacity:.2}}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nv button{font-size:28px;padding:0 14px}
.cd{background:var(--card);border-radius:16px;padding:16px;margin-top:16px}
.mu{color:var(--mut);font-size:14px;margin:6px 0}
.br{height:10px;border-radius:9px;background:var(--ln);margin:12px 0 8px;overflow:hidden}
.br u{display:block;height:100%;background:var(--grn);border-radius:9px;transition:width .6s}
button{cursor:pointer}
.pb{background:var(--fg);color:var(--bg);border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:500;flex:1}
.gh{background:none;border:1px solid var(--ln);color:var(--red);border-radius:12px;padding:13px 16px;font:inherit;font-weight:500}
.lk{background:none;border:0;color:var(--mut);font:inherit}
input{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--fg);margin:8px 0}
label{flex:1;font-size:13px;color:var(--mut)}
.ch{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.ch button{border:1px solid var(--ln);background:none;color:var(--fg);border-radius:20px;padding:8px 12px;font:inherit;font-size:14px}
.ch .on{background:var(--fg);color:var(--bg)}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.g4>div{background:var(--bg);border-radius:12px;padding:12px}.g4 b{display:block;font-size:22px}.g4 span{font-size:12px;color:var(--mut)}
.bars{display:flex;gap:8px;align-items:flex-end;height:84px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--mut)}
.bars u{width:100%;background:var(--grn);border-radius:5px 5px 0 0;display:block}.bars small{margin-top:4px}
.sw{position:relative;width:52px;height:32px;border:0;border-radius:16px;background:var(--mut);flex:none;transition:background .2s}.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}.sw.on{background:var(--grn)}.sw.on::after{transform:translateX(20px)}
.ob{width:100%;margin-top:14px;background:none;border:1px solid var(--ln);color:var(--fg);border-radius:12px;padding:13px 16px;font:inherit;font-weight:500}
.logo{width:24px;height:24px;flex:none;display:block}
#bd{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#sh{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s;box-shadow:0 -8px 30px #0003;z-index:10;max-height:92%;overflow-y:auto}
.o #bd{opacity:1;pointer-events:auto}.o #sh{transform:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body><main><div class="rw"><img class="logo" src="https://i.imgur.com/7JJrrzC.png" alt="">
<div class="hd"><h1 id="mn"></h1><h1 id="yr"></h1></div>
<div class="wk"><span class="s">SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div>
<div class="gr" id="gr"></div></div></div>
<div class="rw nv"><button class="lk" onclick="go(-1)" aria-label="Bulan sebelumnya">‹</button><span id="mt" class="mu"></span><button class="lk" onclick="go(1)" aria-label="Bulan berikutnya">›</button></div>
<p class="mu" style="text-align:center;margin:0">Geser kalender untuk ganti bulan · ketuk tanggal untuk isi tabungan</p>
<p id="warn" class="mu" style="color:var(--red);text-align:center;margin:8px 0 0"></p></main><button id="fab" onclick="mm()" aria-label="Tambah tabungan">+</button><div id="bd" onclick="cl()"></div><div id="sh"></div>
<script>
const $=id=>document.getElementById(id),M=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],H=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
let S={g:null,v:{},off:[0],q:15000,L:{},done:[],rm:{on:false,t:'20:00'}},cur=new Date(),x0,y0,sw=0;cur.setDate(1);
try{Object.assign(S,JSON.parse(localStorage.getItem('tb1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('tb1',JSON.stringify(S));$('warn').textContent=''}catch(e){$('warn').textContent='Penyimpanan penuh, perubahan terakhir belum tersimpan.'}};
const K=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const P=k=>{const[a,b,c]=k.split('-');return new Date(+a,b-1,+c)};
const A=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const R=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const sh=n=>n>=1e6?+(n/1e6).toFixed(1)+'jt':n>=1e3?+(n/1e3).toFixed(1)+'rb':n;
let IMG='';const IC='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',FD=d=>d.getDate()+' '+M[d.getMonth()].slice(0,3)+' '+d.getFullYear();const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const W=d=>!S.off.includes(d.getDay());
let T0,TK;function refreshTK(){T0=new Date();T0.setHours(0,0,0,0);TK=K(T0)}refreshTK();
function render(){refreshTK();
 $('mn').textContent=M[cur.getMonth()];$('yr').textContent=cur.getFullYear();
 const y=cur.getFullYear(),m=cur.getMonth(),n=new Date(y,m+1,0).getDate(),g=S.g,a=g&&g.s,b=g&&K(A(P(g.s),g.d-1));
 let h='<span></span>'.repeat(cur.getDay());
 for(let i=1;i<=n;i++){const d=new Date(y,m,i),k=K(d),v=S.v[k],f=k>TK,ms=g&&!v&&!f&&W(d)&&k>=a&&k<=b&&k!==TK,en=g&&k==b;
  h+=`<button class="d${d.getDay()?'':' su'}${k==TK?' t':''}${v?' v':''}${f?' f':''}${en?' e':''}" data-k="${k}"><span class="n">${i}</span>${v?`<i>${sh(v)}</i>`:en?'<i>🏁</i>':ms?'<i class="m">•</i>':''}</button>`}
 $('gr').innerHTML=h;
 let mt=0;const pf=K(cur).slice(0,7);for(const k in S.v)if(k.startsWith(pf))mt+=S.v[k];
 $('mt').textContent='Bulan ini: '+R(mt);goal();stats();if(window.Android)Android.sync(JSON.stringify({n:(GP||{}).n||'',p:(GP||{}).p||0,k:SK||0,d:!!S.v[TK],dt:TK,o:S.off}));
}
function goal(){window.GP=0;const g=S.g,e=$('gl');
 if(!g){e.innerHTML='<h2>🎯 Target tabungan</h2><p class="mu">Belum ada target. Tentukan nominal, tanggal tercapai, dan foto targetmu.</p><div class="rw"><button class="pb" onclick="gs()">Buat target</button></div>';return}
 const b=K(A(P(g.s),g.d-1));let s=0;for(const k in S.v)if(k>=g.s&&k<=b)s+=S.v[k];
 const rem=Math.max(0,g.t-s),pc=Math.min(100,s/g.t*100);window.GP={n:g.n,p:Math.floor(pc)};let c=0;
 for(let d=A(T0,S.v[TK]?1:0);K(d)<=b;d=A(d,1))if(W(d))c++;
 let est='';if(rem>0&&S.q){let n=Math.ceil(rem/S.q),x=A(T0,S.v[TK]?1:0),z=0;while(z++<3650){if(W(x)&&--n<=0)break;x=A(x,1)}est=`<p class="mu">🗓️ Dengan ${R(S.q)} per hari kerja, target tercapai sekitar ${FD(x)}</p>`}
 const ed=P(b),dl=Math.round((ed-T0)/864e5);
 e.innerHTML=`<div class="rw"><div class="rw" style="justify-content:flex-start;gap:12px;min-width:0">${g.img?`<img class="gi" src="${g.img}" alt="">`:''}<h2>${g.img?'':'🎯 '}${esc(g.n)}</h2></div></div><div class="rw" style="margin-top:10px"><span class="pct">${Math.floor(pc)}%</span><span class="mu" style="text-align:right">${R(s)}<br>dari ${R(g.t)}</span></div><div class="br"><u style="width:${pc}%"></u></div><p class="mu" onclick="gs()">📅 Target tercapai: ${H[ed.getDay()]}, ${FD(ed)} · ${dl>0?`${dl} hari lagi`:dl==0?'hari ini!':'sudah lewat'}</p><p class="mu">${rem<=0?'🎉 Target tercapai! <button class="lk" style="text-decoration:underline" onclick="fin()">Simpan ke Tercapai</button>':c?`Perlu sekitar ${R(Math.ceil(rem/c/1000)*1000)} per hari kerja (${c} hari kerja tersisa).`:'Waktu target sudah habis.'}</p>${est}`}
function stats(){window.SK=0;const ks=Object.keys(S.v).sort(),e=$('st');
 if(!ks.length){e.innerHTML='<h2>📊 Analisis</h2><p class="mu">Isi tabungan pertamamu untuk melihat streak dan konsistensi.</p>';return}
 let run=0,best=0,tot=0,h=0,n=0;for(const k of ks)tot+=S.v[k];
 for(let d=P(ks[0]);d<=T0;d=A(d,1)){const k=K(d);if(!W(d))continue;if(S.v[k]){run++;best=Math.max(best,run)}else if(k!==TK)run=0}
 for(let i=0;i<30;i++){const d=A(T0,-i),k=K(d);if(k<ks[0])break;if(W(d)&&!(i==0&&!S.v[k])){n++;if(S.v[k])h++}}
 const pc=n?Math.round(h/n*100):0,wk=[];window.SK=run;
 for(let w=5;w>=0;w--){let s=0;for(let i=0;i<7;i++)s+=S.v[K(A(T0,-w*7-i))]||0;wk.push(s)}
 const mx=Math.max(...wk,1);
 e.innerHTML=`<div class="rw"><h2>📊 Analisis</h2><span class="mu">${pc>=80?'Sangat rutin 🔥':pc>=50?'Cukup rutin 👍':'Ayo lebih rutin 💪'}</span></div><div class="g4"><div><b>🔥 ${run} hari</b><span>Streak sekarang</span></div><div><b>🏆 ${best} hari</b><span>Streak terbaik</span></div><div><b>${pc}%</b><span>Rutin 30 hari (hari kerja)</span></div><div><b>${sh(tot/ks.length)}</b><span>Rata-rata per hari nabung</span></div></div><div class="bars">${wk.map((s,i)=>`<div><u style="height:${s/mx*60+2}px"></u><small>${i==5?'Kini':'M-'+(5-i)}</small></div>`).join('')}</div><p class="mu">Total per 7 hari. Streak hanya dihitung di hari kerja; hari libur tidak memutus streak.</p>`}
function op(h){$('sh').innerHTML=h;document.body.classList.add('o')}
function cl(){document.body.classList.remove('o')}
function isOpen(){return document.body.classList.contains('o')}
const val=()=>+($('in').value.replace(/\D/g,'')||0);
function fm(e){const n=+e.value.replace(/\D/g,'');e.value=n?n.toLocaleString('id-ID'):''}
function ad(n){$('in').value=(val()+n).toLocaleString('id-ID')}
const LL=k=>S.L[k]||(S.v[k]?[{a:S.v[k],n:''}]:[]);
function setL(k,L){if(L.length){S.L[k]=L;S.v[k]=L.reduce((a,x)=>a+x.a,0)}else{delete S.L[k];delete S.v[k]}save();render()}
function am(k){const d=P(k),L=LL(k);
 op(`<h3>＋ Tambah tabungan</h3><p class="mu">${H[d.getDay()]}, ${FD(d)}${L.length?' · total '+R(S.v[k]):''}</p>${L.map((x,i)=>`<div class="rw en"><div><b>+${R(x.a)}</b><div class="mu">${x.n?esc(x.n):'Tanpa keterangan'}</div></div><button class="lk" onclick="de('${k}',${i})" aria-label="Hapus">✕</button></div>`).join('')}<input id="in" inputmode="numeric" placeholder="Nominal (Rp)" value="${L.length||!S.q?'':(+S.q).toLocaleString('id-ID')}" oninput="fm(this)"><div class="ch">${[5e3,1e4,2e4,5e4,1e5].map(n=>`<button onclick="ad(${n})">+${sh(n)}</button>`).join('')}</div><input id="sr" placeholder="Uang dari mana? mis. uang nemu"><div class="ch">${['Uang jajan','Gaji','Uang nemu','Bonus'].map(t=>`<button onclick="$('sr').value='${t}'">${t}</button>`).join('')}</div><p id="smsg" class="mu" style="color:var(--red);margin:0 0 8px"></p><button class="pb" style="width:100%" onclick="sv('${k}')">Tambah</button>`);
 setTimeout(()=>$('in').focus(),300)}
function sv(k){const n=val();if(!n){$('smsg').textContent='Isi nominal dulu, lalu tekan Tambah.';$('in').focus();return}const L=LL(k).slice();L.push({a:n,n:$('sr').value.trim()});setL(k,L);cl();const c=document.querySelector(`[data-k="${k}"]`);if(c)c.classList.add('p')}
function de(k,i){const L=LL(k).slice();L.splice(i,1);setL(k,L);am(k)}
function mm(){refreshTK();op(`<h3>Menu</h3><div class="ml"><button onclick="am(TK)">＋ Tambah tabungan</button><button onclick="tc()">🏆 Tercapai</button></div>`)}
function pm(){op(`<h3>Ubah</h3><div class="ml"><button onclick="gs()">🎯 Target, tanggal tercapai & foto</button><button onclick="rm()">🔔 Notifikasi & jadwal</button><button onclick="rh()">🧾 Riwayat tabungan</button></div>`)}
function rh(){const ks=Object.keys(S.v).sort().reverse().slice(0,30);op(`<h3>🧾 Riwayat tabungan</h3><div class="ml">${ks.length?ks.map(k=>{const d=P(k);return `<button onclick="am('${k}')"><span>${H[d.getDay()].slice(0,3)}, ${FD(d)}</span><b>${R(S.v[k])}</b></button>`}).join(''):'<p class="mu">Belum ada tabungan.</p>'}</div>`)}
function tc(){const L=S.done||[];op(`<h3>🏆 Tercapai</h3>${L.length?L.map(x=>`<div class="rw" style="justify-content:flex-start;gap:12px;margin:10px 0">${x.img?`<img class="gi" src="${x.img}" alt="">`:'<div class="gi" style="display:grid;place-items:center;background:var(--card)">🎯</div>'}<div><b>${esc(x.n)}</b><div class="mu">${R(x.s)} dari ${R(x.t)}<br>Tercapai ${FD(P(x.at))}</div></div></div>`).join(''):'<p class="mu">Belum ada target yang tercapai.</p>'}${S.g?'<button class="pb" style="width:100%;margin-top:8px" onclick="fin()">✅ Tandai target ini tercapai</button>':''}`)}
function fin(){const g=S.g;if(!g)return;const b=K(A(P(g.s),g.d-1));let t=0;for(const k in S.v)if(k>=g.s&&k<=b)t+=S.v[k];(S.done=S.done||[]).unshift({n:g.n,t:g.t,s:t,img:g.img,at:TK});S.g=null;save();cl();render()}
function rm(){const r=S.rm||{},on=!!r.on,ds=rdays(),ok=!window.Android||Android.canNotify();op(`<h3>🔔 Notifikasi & jadwal</h3><p class="mu">Pengingat dikirim kalau kamu belum nabung di hari yang dipilih.</p>${ok?'':'<p class="mu" style="color:var(--red)">Notifikasi belum diizinkan. Aktifkan di Pengaturan HP, pada bagian notifikasi untuk Kalender Tabung.</p>'}<div class="rw" style="margin:14px 0"><span>Aktifkan pengingat</span><button id="ro" class="sw${on?' on':''}" role="switch" aria-checked="${on}" aria-label="Aktifkan pengingat" onclick="tg(this)"></button></div><label style="display:block">Jam pengingat<input id="rt" type="time" value="${r.t||'20:00'}"></label><p class="mu">Hari pengingat:</p><div class="ch" id="rd">${H.map((h,i)=>`<button class="${ds.includes(i)?'on':''}" data-i="${i}" onclick="this.classList.toggle('on')">${h.slice(0,3)}</button>`).join('')}</div><p id="rmsg" class="mu"></p><button class="ob" onclick="tes()">🔔 Coba notifikasi sekarang</button><button class="pb" style="width:100%;margin-top:8px" onclick="rs()">Simpan</button>`)}
function rs(){const on=$('ro').classList.contains('on'),d=[...document.querySelectorAll('#rd .on')].map(b=>+b.dataset.i);if(on&&!d.length){pesan('Pilih minimal satu hari supaya pengingat bisa dikirim.',1);return}S.rm={on,t:$('rt').value||'20:00',d,f:(S.rm||{}).f};save();cl();remSync();if(on&&window.Android&&!Android.canNotify())Android.ask();if(on&&!window.Android){izin();cekRem()}}
function remSync(){const r=S.rm||{},[h,m]=(r.t||'20:00').split(':').map(Number),dm=rdays().reduce((a,x)=>a|1<<x,0);if(window.Android)Android.remind(!!r.on,h,m,dm)}
