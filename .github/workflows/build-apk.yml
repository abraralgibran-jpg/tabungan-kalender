name: Build Kalender Tabung APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KalenderTabung_v7_perbaikan_notifikasi/KalenderTabung
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          build-root-directory: KalenderTabung_v7_perbaikan_notifikasi/KalenderTabung

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KalenderTabung-debug-apk
          path: KalenderTabung_v7_perbaikan_notifikasi/KalenderTabung/app/build/outputs/apk/debug/app-debug.apk
